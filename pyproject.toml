[project]
name = "arp"
version = "0.2.0"
description = "Agent Rollout Protocol — runtime and agent integration refactor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gateway = "gateway.server:main"
rollout = "rollout.server:main"
