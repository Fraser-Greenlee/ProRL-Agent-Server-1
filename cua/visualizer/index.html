<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trajectory Visualizer</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242836;
    --border: #2e3348;
    --text: #e1e4ed;
    --text2: #8b90a5;
    --accent: #6c8cff;
    --accent-dim: #3d5199;
    --green: #4ade80;
    --red: #f87171;
    --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  header .stats { font-size: 13px; color: var(--text2); }

  .main { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: 380px; min-width: 300px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header input {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 13px; outline: none;
  }
  .sidebar-header input:focus { border-color: var(--accent); }
  .traj-list { flex: 1; overflow-y: auto; }
  .traj-item {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .traj-item:hover { background: var(--surface2); }
  .traj-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
  .traj-item .traj-id { font-size: 13px; font-weight: 600; color: var(--accent); }
  .traj-item .traj-goal {
    font-size: 12px; color: var(--text2); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .traj-item .traj-meta {
    font-size: 11px; color: var(--text2); margin-top: 4px;
    display: flex; gap: 8px;
  }
  .traj-item .traj-meta .badge {
    background: var(--surface2); padding: 1px 6px; border-radius: 3px;
    font-size: 10px;
  }

  /* Content area */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Trajectory header */
  .traj-header {
    padding: 16px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .traj-header .goal { font-size: 15px; font-weight: 500; line-height: 1.4; }
  .traj-header .meta-row { font-size: 12px; color: var(--text2); margin-top: 6px; display: flex; gap: 16px; }

  /* Action viewer */
  .action-viewer { flex: 1; display: flex; overflow: hidden; }

  /* Screenshot panel */
  .screenshot-panel {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px; background: #000; position: relative;
    min-width: 0;
  }
  .screenshot-panel img {
    max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;
  }
  .screenshot-panel .nav-overlay {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: rgba(26,29,39,0.9); padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .screenshot-panel .nav-overlay button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 5px;
    cursor: pointer; font-size: 13px; transition: background 0.15s;
  }
  .screenshot-panel .nav-overlay button:hover { background: var(--accent-dim); }
  .screenshot-panel .nav-overlay button:disabled { opacity: 0.3; cursor: default; }
  .screenshot-panel .nav-overlay .step-label { font-size: 13px; font-weight: 500; min-width: 80px; text-align: center; }

  /* Action details panel */
  .details-panel {
    width: 420px; min-width: 320px; background: var(--surface);
    border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
  }
  .detail-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .detail-section h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text2); margin-bottom: 8px;
  }
  .detail-section .code-block {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; font-family: 'SF Mono', Monaco, 'Fira Code', monospace;
    font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    color: var(--green);
  }
  .detail-section .thought-block {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; font-size: 12px;
    line-height: 1.5; white-space: pre-wrap; color: var(--text);
  }
  .detail-section .label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .detail-section .value { font-size: 13px; }
  .detail-section .action-text { color: var(--orange); font-weight: 500; }

  /* Action timeline */
  .action-timeline {
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 4px;
  }
  .action-timeline .dot {
    width: 28px; height: 28px; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font-size: 10px;
    font-weight: 600; cursor: pointer; border: 2px solid transparent;
    background: var(--surface2); color: var(--text2); transition: all 0.15s;
  }
  .action-timeline .dot:hover { border-color: var(--accent); }
  .action-timeline .dot.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .action-timeline .dot.done { background: #1a3a2a; color: var(--green); }
  .action-timeline .dot.fail { background: #3a1a1a; color: var(--red); }

  /* Empty state */
  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: 15px; flex-direction: column; gap: 8px;
  }
  .empty .hint { font-size: 12px; }

  /* Loading */
  .loading { color: var(--text2); font-size: 13px; padding: 20px; text-align: center; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  /* Keyboard hints */
  .kbd {
    display: inline-block; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px; font-size: 11px; font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <h1>Trajectory Visualizer</h1>
  <span class="stats" id="stats">Loading...</span>
  <span style="margin-left:auto; font-size:12px; color:var(--text2)">
    <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> navigate actions &nbsp;
    <span class="kbd">&uarr;</span> <span class="kbd">&darr;</span> select trajectory
  </span>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <input type="text" id="search" placeholder="Search goals..." autocomplete="off">
    </div>
    <div class="traj-list" id="trajList"></div>
  </div>

  <div class="content" id="content">
    <div class="empty">
      <div>Select a trajectory from the sidebar</div>
      <div class="hint">Use <span class="kbd">&uarr;</span> <span class="kbd">&darr;</span> to navigate</div>
    </div>
  </div>
</div>

<script>
const state = {
  trajectories: [],
  filtered: [],
  selected: null,       // index into filtered
  trajectory: null,     // loaded trajectory data
  actionIndex: 0,
  imageCache: {},
};

// --- API ---
async function fetchList() {
  const res = await fetch('/api/list');
  return res.json();
}

async function fetchTrajectory(id) {
  const res = await fetch(`/api/trajectory?id=${encodeURIComponent(id)}`);
  return res.json();
}

function imageUrl(path) {
  return `/api/image_raw?path=${encodeURIComponent(path)}`;
}

// --- Sidebar ---
function renderList() {
  const el = document.getElementById('trajList');
  el.innerHTML = '';
  state.filtered.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'traj-item' + (i === state.selected ? ' active' : '');
    div.innerHTML = `
      <div class="traj-id">${t.collection}/${t.trajectory_id}</div>
      <div class="traj-goal">${escHtml(t.goal)}</div>
      <div class="traj-meta">
        <span class="badge">${t.n_actions} actions</span>
        <span class="badge">${t.pipeline}</span>
      </div>
    `;
    div.onclick = () => selectTrajectory(i);
    el.appendChild(div);
  });
}

function filterList(query) {
  const q = query.toLowerCase();
  state.filtered = q
    ? state.trajectories.filter(t =>
        t.goal.toLowerCase().includes(q) ||
        t.id.toLowerCase().includes(q) ||
        t.trajectory_id.toLowerCase().includes(q))
    : [...state.trajectories];
  state.selected = state.filtered.length > 0 ? 0 : null;
  renderList();
}

// --- Trajectory view ---
async function selectTrajectory(index) {
  if (index < 0 || index >= state.filtered.length) return;
  state.selected = index;
  renderList();
  scrollSelectedIntoView();

  const t = state.filtered[index];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">Loading trajectory...</div>';

  const data = await fetchTrajectory(t.id);
  state.trajectory = data;
  state.actionIndex = 0;
  renderTrajectory();
}

function getAllActions(traj) {
  const actions = [];
  for (const step of (traj.steps || [])) {
    for (const a of (step.actions || [])) {
      actions.push(a);
    }
  }
  return actions;
}

function resolveScreenshotPath(traj, action, trajId) {
  let p = action.screenshot || '';
  if (!p) return '';
  // If absolute path, try to make relative to trajectories dir
  // The server handles both absolute and relative
  return p;
}

function renderTrajectory() {
  const traj = state.trajectory;
  if (!traj) return;

  const actions = getAllActions(traj);
  const content = document.getElementById('content');

  if (actions.length === 0) {
    content.innerHTML = `
      <div class="traj-header">
        <div class="goal">${escHtml(traj.goal || 'No goal')}</div>
        <div class="meta-row">
          <span>ID: ${escHtml(traj.trajectory_id || '')}</span>
        </div>
      </div>
      <div class="empty">No actions in this trajectory</div>
    `;
    return;
  }

  const a = actions[state.actionIndex] || actions[0];
  const gen = a.action_generation || {};
  const meta = traj.metadata || {};

  content.innerHTML = `
    <div class="traj-header">
      <div class="goal">${escHtml(traj.goal || 'No goal')}</div>
      <div class="meta-row">
        <span>ID: ${escHtml(traj.trajectory_id || '')}</span>
        <span>Screen: ${escHtml(meta.screen_size || '?')}</span>
        <span>Pipeline: ${escHtml(meta.pipeline || '?')}</span>
        <span>Actions: ${actions.length}</span>
      </div>
    </div>
    <div class="detail-section">
      <div class="action-timeline" id="timeline"></div>
    </div>
    <div class="action-viewer">
      <div class="screenshot-panel">
        <img id="screenshotImg" src="" alt="Screenshot">
        <div class="nav-overlay">
          <button id="btnPrev" onclick="prevAction()">&larr; Prev</button>
          <span class="step-label" id="stepLabel"></span>
          <button id="btnNext" onclick="nextAction()">Next &rarr;</button>
        </div>
      </div>
      <div class="details-panel" id="detailsPanel"></div>
    </div>
  `;

  renderTimeline(actions);
  renderAction(actions, state.actionIndex);
}

function renderTimeline(actions) {
  const el = document.getElementById('timeline');
  if (!el) return;
  el.innerHTML = '';
  actions.forEach((a, i) => {
    const dot = document.createElement('div');
    let cls = 'dot';
    if (i === state.actionIndex) cls += ' active';
    else if (a.action_type === 'done') cls += ' done';
    else if (a.action_type === 'fail') cls += ' fail';
    dot.className = cls;
    dot.textContent = i;
    dot.title = `Action ${i}: ${(a.action_generation || {}).action || a.action_type || ''}`.slice(0, 80);
    dot.onclick = () => { state.actionIndex = i; renderTrajectory(); };
    el.appendChild(dot);
  });
}

function renderAction(actions, idx) {
  const a = actions[idx];
  if (!a) return;

  // Screenshot
  const img = document.getElementById('screenshotImg');
  if (a.screenshot) {
    img.src = imageUrl(a.screenshot);
  } else {
    img.src = '';
  }

  // Step label
  document.getElementById('stepLabel').textContent = `${idx + 1} / ${actions.length}`;
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === actions.length - 1;

  // Details
  const gen = a.action_generation || {};
  const panel = document.getElementById('detailsPanel');
  panel.innerHTML = '';

  // Action type badge
  addSection(panel, 'Action Type', `<span class="action-text">${escHtml(a.action_type || 'unknown')}</span>`);

  // Command
  if (a.pyautogui_command) {
    addSection(panel, 'PyAutoGUI Command', `<div class="code-block">${escHtml(a.pyautogui_command)}</div>`);
  }

  // Original code (before coordinate projection)
  if (gen.original_code) {
    addSection(panel, 'Original Code (relative coords)', `<div class="code-block" style="color:var(--orange)">${escHtml(gen.original_code)}</div>`);
  }

  // Action description
  if (gen.action) {
    addSection(panel, 'Action Description', `<div class="value">${escHtml(gen.action)}</div>`);
  }

  // Thought / reasoning
  const thought = gen.thought || a.raw_reasoning || '';
  if (thought) {
    addSection(panel, 'Reasoning', `<div class="thought-block">${escHtml(thought)}</div>`);
  }

  // Raw response
  if (a.raw_response) {
    addSection(panel, 'Raw Model Response', `<div class="thought-block" style="font-family:monospace;font-size:11px">${escHtml(a.raw_response)}</div>`);
  }
}

function addSection(parent, title, html) {
  const div = document.createElement('div');
  div.className = 'detail-section';
  div.innerHTML = `<h3>${title}</h3>${html}`;
  parent.appendChild(div);
}

// --- Navigation ---
function prevAction() {
  if (state.actionIndex > 0) {
    state.actionIndex--;
    renderTrajectory();
  }
}

function nextAction() {
  const actions = getAllActions(state.trajectory);
  if (state.actionIndex < actions.length - 1) {
    state.actionIndex++;
    renderTrajectory();
  }
}

function scrollSelectedIntoView() {
  const items = document.querySelectorAll('.traj-item');
  if (state.selected !== null && items[state.selected]) {
    items[state.selected].scrollIntoView({ block: 'nearest' });
  }
}

// --- Keyboard ---
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in search
  if (document.activeElement && document.activeElement.id === 'search') {
    if (e.key === 'Escape') { document.activeElement.blur(); }
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'a') {
    e.preventDefault();
    prevAction();
  } else if (e.key === 'ArrowRight' || e.key === 'd') {
    e.preventDefault();
    nextAction();
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    if (state.selected !== null && state.selected > 0) {
      selectTrajectory(state.selected - 1);
    }
  } else if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    if (state.selected !== null && state.selected < state.filtered.length - 1) {
      selectTrajectory(state.selected + 1);
    }
  } else if (e.key === '/') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// --- Util ---
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// --- Init ---
async function init() {
  const data = await fetchList();
  state.trajectories = data;
  state.filtered = [...data];
  document.getElementById('stats').textContent = `${data.length} trajectories`;
  renderList();

  document.getElementById('search').addEventListener('input', (e) => {
    filterList(e.target.value);
  });
}

init();
</script>
</body>
</html>
