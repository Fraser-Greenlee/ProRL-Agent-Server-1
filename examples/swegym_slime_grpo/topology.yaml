rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ./rollout_results

gateway:
  heartbeat_interval_seconds: 30
  nodes:
    - id: localhost-node-01
      host: 127.0.0.1
      port: 8100
      public_url: http://127.0.0.1:8100
      max_init_workers: 8
      max_run_workers: 8
      max_postrun_workers: 8
      model_served: Qwen/Qwen3.5-4B
      sglang:
        # Slime's sglang-router binds to the node's external IP (not 0.0.0.0),
        # so 127.0.0.1 doesn't reach it. Hardcode the host IP.
        base_url: http://10.34.1.129:9000
