rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ./rollout_results

gateway:
  heartbeat_interval_seconds: 30
  nodes:
    - id: localhost-node-01
      host: 127.0.0.1
      port: 8100
      public_url: http://127.0.0.1:8100
      max_init_workers: 8
      max_run_workers: 6
      max_postrun_workers: 6
      ready_buffer_target: 4
      model_served: Qwen/Qwen3-4B
      sglang:
        # Points at slime's sglang-router (started by Ray inside docker)
        base_url: http://127.0.0.1:9000
