# Polar bridge configuration for Slime's --custom-config-path.
# These become attributes on the `args` namespace passed to the rollout function.

polar_rollout_url: "http://127.0.0.1:8080"
polar_reward_key: "score"
polar_max_concurrency: 32
polar_request_timeout: 3600
polar_eval_dataset_name: "swegym_eval"

# Task template rendered per sample group.  Placeholders are filled
# from the context: {instruction}, {num_samples}, {sample.*}, {args.*}.
polar_task_template:
  timeout_seconds: 2400
  runtime:
    backend: "docker"
    # Use the image built by build_images.py directly — apptainer's
    # unprivileged-userns mode fails on this host (no subuid/subgid mappings),
    # so we fall back to docker which works out of the box.
    image: "{sample.metadata.polar_image}"
    network: "host"
    workdir: "/polar/session/workspace"
    prepare:
      - type: exec
        command: >-
          rm -rf /polar/session/workspace &&
          mkdir -p /polar/session/logs/agent /polar/session/workspace "$HOME/.venv/bin" &&
          cp -a /testbed/. /polar/session/workspace/ &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python3" &&
          git config --global core.pager '' &&
          cd /polar/session/workspace && git reset --hard &&
          (command -v npm >/dev/null || /opt/miniconda3/bin/conda install -y -n base -c conda-forge nodejs >/dev/null 2>&1) &&
          export PATH="/opt/miniconda3/bin:$PATH" &&
          npm install -g opencode-ai@latest;
          true
  agent:
    harness: "opencode"
    # opencode addresses models as `<provider>/<model_id>`.  The gateway auto-
    # injects OPENAI_BASE_URL pointing at the SGLang router, so we route via
    # the `openai` provider and use the HF id SGLang serves under.
    model_name: "openai/Qwen/Qwen3.5-27B"
    env:
      OPENCODE_FAKE_VCS: "git"
    settings: {}
  builder:
    strategy: "per_request"
  evaluator:
    strategy: "swebench_harness"
    refresh_runtime: true
    config:
      repo_dir: "/testbed"
      patch_command: "cd /polar/session/workspace && git add -A && git diff --cached --binary"
      instance: "{sample.metadata.instance}"
      exclude_patterns:
        - "trajectories/**"
        - "**/trajectories/**"
        - ".opencode/**"
        - "**/.opencode/**"
        - ".config/opencode/**"

polar_task_id_template: "polar-swegym-grpo-{rollout_id}-{sample.group_index}"
