# Polar bridge configuration for Slime's --custom-config-path.
# These become attributes on the `args` namespace passed to the rollout function.

polar_rollout_url: "http://127.0.0.1:8080"
polar_reward_key: "score"
polar_max_concurrency: 16
polar_max_session_concurrency: 128
polar_max_async_level: 2
polar_max_off_policy_steps: 1
polar_max_task_retries: 2
polar_request_timeout: 3600
polar_callback_host: "127.0.0.1"
polar_allow_weight_update_overlap: true
polar_eval_dataset_name: "swegym_eval"
polar_instruction_template: |
  Fix the following issue in the repository at /polar/session/workspace.
  Read the relevant files, then use your tools to edit the code. You must
  make at least one concrete file edit before ending.

  {instruction}

# Task template rendered per sample group.  Placeholders are filled
# from the context: {instruction}, {num_samples}, {sample.*}, {args.*}.
polar_task_template:
  timeout_seconds: 3600
  runtime:
    backend: "docker"
    # Use the image built by build_images.py directly — apptainer's
    # unprivileged-userns mode fails on this host (no subuid/subgid mappings),
    # so we fall back to docker which works out of the box.
    image: "{sample.metadata.polar_image}"
    network: "host"
    workdir: "/polar/session/workspace"
    # Node 22 + codex are pre-baked into the image (Dockerfile v3) — no npm
    # install at session start, which removes the main docker-daemon stressor.
    prepare:
      - type: exec
        command: >-
          rm -rf /polar/session/workspace &&
          mkdir -p /polar/session/logs/agent /polar/session/workspace "$HOME/.venv/bin" &&
          cp -a /testbed/. /polar/session/workspace/ &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python3" &&
          git config --global core.pager '' &&
          cd /polar/session/workspace && git reset --hard;
          true
    # Eval runtime applies the patch + runs swebench tests — no codex needed.
    eval_prepare:
      - type: exec
        command: >-
          mkdir -p /polar/session/logs/agent "$HOME/.venv/bin" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python" &&
          ln -sf /opt/miniconda3/envs/testbed/bin/python "$HOME/.venv/bin/python3" &&
          git config --global core.pager '';
          true
  agent:
    harness: "qwen_code"
    model_name: "openai/Qwen/Qwen3.5-4B"
  builder:
    strategy: "prefix_merging"
  evaluator:
    strategy: "swebench_harness"
    refresh_runtime: true
    config:
      repo_dir: "/testbed"
      patch_command: "cd /polar/session/workspace && git add -A && git diff --cached --binary"
      instance: "{sample.metadata.instance}"
      # Strip per-harness config/session dirs and common stray artifacts that
      # would otherwise get swept into `git add -A` and bloat the patch.
      exclude_patterns:
        - "trajectories/**"
        - "**/trajectories/**"
        - "node_modules/**"
        - "**/node_modules/**"
        - ".cache/**"
        - "**/.cache/**"
        - ".venv/**"
        - "**/.venv/**"
        - ".claude/**"
        - "**/.claude/**"
        - ".codex/**"
        - "**/.codex/**"
        - ".gemini/**"
        - "**/.gemini/**"
        - ".opencode/**"
        - "**/.opencode/**"
        - ".config/opencode/**"
        - ".pi/**"
        - "**/.pi/**"
        - ".qwen/**"
        - "**/.qwen/**"
        # Guard against the historical claude_code $HOME-literal env bug
        # (now fixed, but old workspaces may still carry these dirs).
        - "$HOME/**"
        - "**/$HOME/**"

polar_task_id_template: "polar-swegym-grpo-{rollout_id}-{sample.group_index}"
