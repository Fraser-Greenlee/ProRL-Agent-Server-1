rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ./rollout_results
  dispatch_poll_interval_seconds: 1.0
  callback_grace_seconds: 10.0

gateway:
  heartbeat_interval_seconds: 10
  nodes:
    - id: localhost-node-01
      host: 127.0.0.1
      port: 8100
      public_url: http://127.0.0.1:8100
      max_init_workers: 8
      max_run_workers: 4
      max_postrun_workers: 4
      ready_buffer_target: 4
      model_served: MiniMaxAI/MiniMax-M2.5
      vllm:
        base_url: http://127.0.0.1:8000
        timeout: 300
    - id: localhost-node-02
      host: 127.0.0.1
      port: 8101
      public_url: http://127.0.0.1:8101
      max_init_workers: 8
      max_run_workers: 4
      max_postrun_workers: 4
      ready_buffer_target: 4
      model_served: MiniMaxAI/MiniMax-M2.5
      vllm:
        base_url: http://127.0.0.1:8001
        timeout: 300
